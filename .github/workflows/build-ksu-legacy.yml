name: Build KSU-Next Legacy for moto g45
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev build-essential libarchive-tools

      - name: Setup Clang
        run: |
          mkdir -p $HOME/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          tar -xzf clang.tar.gz -C $HOME
          echo "$HOME/clang-r547379/bin" >> $GITHUB_PATH

      - name: Setup KSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Build Kernel
        run: |
          export KBUILD_BUILD_USER="shivansh"
          export KBUILD_BUILD_HOST="github"
          export PATH=$HOME/clang-r547379/bin:$PATH
          make ARCH=arm64 O=out parrot_defconfig
          make ARCH=arm64 O=out -j$(nproc) CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-ksu-moto-g45
          path: out/arch/arm64/boot/Image*
