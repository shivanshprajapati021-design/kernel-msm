name: Build KSU-Next Legacy for moto g45
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python2 python3 bison flex libssl-dev libelf-dev bc cpio pahole libxml2-utils libncurses-dev

      - name: Setup Clang r510928
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r510928.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz
          echo "$HOME/toolchain/clang-r510928/bin" >> $GITHUB_PATH

      - name: Apply KSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github
          make O=out vendor/parrot-perf_defconfig
          make O=out ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 -j$(nproc --all) 2>&1 | tee build.log

      - name: Upload Kernel Image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moto-g45-ksu-kernel
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/Image
            build.log
