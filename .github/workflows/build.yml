name: Moto G45 Fast Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: g45-parrot
          max-size: 2G

      - name: Install Deps
        run: sudo apt update && sudo apt install -y bc bison flex libssl-dev libelf-dev cpio pahole git

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Setup KSU
        run: curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s

      - name: Build
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="ccache clang"
          mkdir -p out
          make O=out ARCH=arm64 vendor/parrot_defconfig
          echo "CONFIG_KSU=y" >> out/.config
          make O=out ARCH=arm64 olddefconfig
          make O=out ARCH=arm64 -j$(nproc --all) Image

      - name: Package
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image ak3/
          cd ak3 && zip -r9 ../Moto-G45.zip * -x .git/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G45-Fast
          path: Moto-G45.zip
