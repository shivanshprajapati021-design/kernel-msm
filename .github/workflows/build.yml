name: Build G45 KSU Final Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libudev-dev libpci-dev libiberty-dev cpio pahole git ccache

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          clang/bin/clang --version

      - name: Setup KSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> arch/arm64/configs/gki_defconfig

      - name: Build Kernel
        run: |
          set -e
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          mkdir -p out
          make O=out gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/parrot_GKI.config
          make O=out olddefconfig
          make O=out -j$(nproc --all) Image dtb.img dtbo.img
          # gzip bana lo AK3 ke liye
          gzip -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.gz || true
          ls -lh out/arch/arm64/boot/

      - name: Package AK3
        run: |
          ls -lh out/arch/arm64/boot/
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          # Image ya Image.gz jo bhi mile copy karo
          cp out/arch/arm64/boot/Image ak3
