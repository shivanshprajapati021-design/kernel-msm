name: Build G45 KSU Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deps
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev git ccache

      - name: Setup Clang
        uses: actions/checkout@v4
        with:
          repository: crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r536225
          path: clang
          fetch-depth: 1

      - name: Setup Clang Path
        run: |
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          clang/bin/clang --version

      - name: Setup KSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo -e "CONFIG_KSU=y\nCONFIG_KSU_KPROBES_HOOK=n" >> arch/arm64/configs/gki_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          mkdir -p out
          make O=out gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/parrot_G
