name: Build G45 KSU Final Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev libudev-dev libpci-dev libiberty-dev cpio pahole git ccache

      - name: Setup Proton Clang
        run: |
          git clone https://github.com/kdrag0n/proton-clang.git --depth=1 clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          clang/bin/clang --version

      - name: Setup KSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "CONFIG_KSU=y" >> arch/arm64/configs/gki_defconfig
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> arch/arm64/configs/gki_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          mkdir -p out
          make O=out gki_defconfig
          # Parrot ka config merge - sirf 1 hi karenge, 2 karne se error aata hai
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/parrot_GKI.config
          make O=out olddefconfig
          make O=out -j$(nproc --all) CC="ccache clang" Image.gz dtb.img dtbo.img 2>&1 | tee build.log
          echo "BUILD SUCCESS"

      - name: Package AK3
        if: success()
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image.gz ak3/
          cp out/arch/arm64/boot/dtb.img ak3/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img ak3/ 2>/dev/null || true
          cd ak3 && zip -r9 ../Moto-G45-KSU-Parrot.zip * -x .git/*

      - name: Upload Zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G45-KSU-Final
          path: Moto-G45-KSU-Parrot.zip

      - name: Upload Log on Fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
