name: Build G45 KSU Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Deps and Clang
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev git ccache clang lld llvm
          mkdir -p clang/bin
          ln -sf /usr/bin/clang clang/bin/clang
          ln -sf /usr/bin/clang++ clang/bin/clang++
          ln -sf /usr/bin/ld.lld clang/bin/ld.lld
          ln -sf /usr/bin/llvm-objcopy clang/bin/llvm-objcopy
          ln -sf /usr/bin/llvm-ar clang/bin/llvm-ar
          ln -sf /usr/bin/llvm-nm clang/bin/llvm-nm
          ln -sf /usr/bin/llvm-strip clang/bin/llvm-strip
          ln -sf /usr/bin/llvm-objdump clang/bin/llvm-objdump
          ln -sf /usr/bin/llvm-readelf clang/bin/llvm-readelf
          echo "$PWD/clang/bin" >> $GITHUB_PATH
          clang --version

      - name: Setup KSU-Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo -e "CONFIG_KSU=y\nCONFIG_KSU_KPROBES_HOOK=n" >> arch/arm64/configs/gki_defconfig

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          mkdir -p out
          make O=out gki_defconfig
          ./scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/vendor/parrot_GKI.config arch/arm64/configs/vendor/parrot_consolidate.config
          make O=out olddefconfig
          make O=out -j$(nproc --all) Image.gz dtb.img dtbo.img

      - name: Package AK3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image.gz ak3/
          cp out/arch/arm64/boot/dtb.img ak3/ 2>/dev/null || true
          cp out/arch/arm64/boot/dtbo.img ak3/ 2>/dev/null || true
          cd ak3 && zip -r9 ../Moto-G45-KSU-Parrot.zip * -x .git/*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Moto-G45-KSU
          path: Moto-G45-KSU-Parrot.zip
